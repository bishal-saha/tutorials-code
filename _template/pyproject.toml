[project]
name = "example-slug"            # rename to the content slug
version = "0.1.0"
description = "Companion code for <title> on iambishal.com"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
